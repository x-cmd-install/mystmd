ements\n\n- Disable hidden pages tests temporarily [#3141](https://github.com/jupyter-book/mystmd/pull/3141) ([@agoose77](https://github.com/agoose77))\n- Normalize reference identifier once per lookup [#3135](https://github.com/jupyter-book/mystmd/pull/3135) ([@stefanv](https://github.com/stefanv), [@agoose77](https://github.com/agoose77))\n- Return frozen store state from selectors without deep copies [#3134](https://github.com/jupyter-book/mystmd/pull/3134) ([@stefanv](https://github.com/stefanv), [@agoose77](https://github.com/agoose77))\n\n## Other merged PRs\n\n- 🚀 Release [#3120](https://github.com/jupyter-book/mystmd/pull/3120) ([@agoose77](https://github.com/agoose77))\n\n## Contributors to this release\n\nThe following people contributed discussions, new ideas, code and documentation contributions, and review.\nSee [our definition of contributors](https://github-activity.readthedocs.io/en/latest/use/#how-does-this-tool-define-contributions-in-the-reports).\n\n([GitHub contributors page for this release](https://github.com/jupyter-book/mystmd/graphs/contributors?from=2026-10-26&to=2026-11-12&type=c))\n\n@agoose77 ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Aagoose77+updated%3A2026-10-26..2026-11-12&type=Issues)) | @Anteru ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3AAnteru+updated%3A2026-10-26..2026-11-12&type=Issues)) | @brian-rose ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Abrian-rose+updated%3A2026-10-26..2026-11-12&type=Issues)) | @choldgraf ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Acholdgraf+updated%3A2026-10-26..2026-11-12&type=Issues)) | @claude ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3Aclaude+updated%3A2026-10-26..2026-11-12&type=Issues)) | @LecrisUT ([activity](https://github.com/search?q=repo%3Ajupyter-book%2Fmystmd+involves%3ALecrisUT+updated%3A2026-10-26..2026-11-12&